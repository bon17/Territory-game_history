<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사 섬 땅따먹기</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { min-height: 100%; background: url('images/background.jpg') center / cover fixed, var(--sea); }
  .home { width: min(1180px, 100%); margin: 0 auto; padding: 36px max(18px, env(safe-area-inset-left, 0px)) 40px; display: grid; gap: 22px; justify-items: center; }

  /* 제목 영역: 무엇을 하는 게임인지 먼저 */
  .badge { font-family: var(--round); font-size: clamp(18px, 2.4vw, 26px); background: #FFD84D; border: 4px solid var(--ink); border-radius: 999px; padding: 6px 22px; box-shadow: 0 5px 0 var(--ink); }
  .home h1 { margin: 0; font-size: clamp(64px, 11vw, 140px); line-height: 1; text-align: center; letter-spacing: -1px;
    text-shadow: 4px 4px 0 #fff, -4px 4px 0 #fff, 4px -4px 0 #fff, -4px -4px 0 #fff, 0 10px 0 rgba(59,53,97,.25); }
  .home h1 .island { color: #F2708A; }
  .sub { margin: 0; font-size: clamp(18px, 2.2vw, 24px); font-weight: 700; text-align: center; background: rgba(255,255,255,.9); border-radius: 14px; padding: 6px 16px; }
  .chars { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(4px, 1.2vw, 14px); }
  .chars img { width: clamp(64px, 10vw, 128px); height: clamp(64px, 10vw, 128px); object-fit: contain; animation: bounce 1.6s ease-in-out infinite; }

  /* 메뉴: 작고 단정한 버튼 */
  .menu { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
  .menu a { text-decoration: none; color: var(--ink); background: #fff; border: 3px solid var(--ink); border-radius: 999px; box-shadow: 0 4px 0 var(--ink);
    padding: 8px 20px 8px 10px; display: flex; align-items: center; gap: 8px; font-family: var(--round); font-size: 22px; min-height: 52px; transition: transform .1s, box-shadow .1s; }
  .menu a:hover { transform: translateY(-2px); box-shadow: 0 6px 0 var(--ink); }
  .menu a:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .menu a:focus-visible { outline: 4px solid #FF7A00; outline-offset: 3px; }
  .menu img { width: 36px; height: 36px; object-fit: contain; }
  .menu a.main { background: #FFD84D; }
  .note { font-size: 14px; color: var(--ink2); background: rgba(255,255,255,.85); border-radius: 12px; padding: 6px 14px; text-align: center; }
</style>
</head>
<body>
<main class="home">
  <div class="badge">중2 역사 · 기말고사 복습 게임</div>
  <h1><span class="island">역사 섬</span> 땅따먹기</h1>
  <div class="chars" aria-hidden="true">
    <img src="images/team1.png" alt="" style="animation-delay:0s"><img src="images/team2.png" alt="" style="animation-delay:.15s">
    <img src="images/team3.png" alt="" style="animation-delay:.3s"><img src="images/team4.png" alt="" style="animation-delay:.45s">
    <img src="images/team5.png" alt="" style="animation-delay:.6s"><img src="images/team6.png" alt="" style="animation-delay:.75s">
  </div>
  <p class="sub">역사 문제를 맞혀 코인을 모으고, 몰래 걸어서 섬을 차지해요!</p>
  <nav class="menu" aria-label="메뉴">
    <a class="main" href="host.html"><img src="images/crown.png" alt="">수업 시작</a>
    <a href="rules.html"><img src="images/letter.png" alt="">게임 설명</a>
    <a href="play.html"><img src="images/coin.png" alt="">학생 입장</a>
    <a href="test.html"><img src="images/hourglass.png" alt="">테스트</a>
  </nav>
  <div class="note" id="mode"></div>
</main>
<script src="firebase-config.js"></script>
<script>
  // 실제 접속 모드인지 알려 주기
  (function () {
    var cfg = window.FIREBASE_CONFIG;
    document.getElementById('mode').textContent = cfg && cfg.apiKey
      ? '실제 수업 모드: 학생 탭에서 접속할 수 있어요'
      : '지금은 데모 모드예요. Firebase를 연결하기 전에는 이 컴퓨터 안에서만 시험할 수 있어요';
  })();
</script>
</body>
</html>
