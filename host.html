<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>역사 섬 땅따먹기 · TV</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body.host { overflow: hidden; }
  section.screen { position: fixed; inset: 0; display: flex; }

  /* 시작 화면 */
  #setup { align-items: center; justify-content: center; padding: 24px; }
  #setup .card { width: min(980px, 100%); max-height: 100%; overflow: auto; padding: 32px 36px; display: grid; gap: 18px; }
  #setup h1 { margin: 0; font-size: 46px; display: flex; align-items: center; gap: 16px; }
  #setup .row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; font-size: 20px; }
  #setup label { display: flex; gap: 10px; align-items: center; }
  #setup select { font: inherit; padding: 8px 12px; border-radius: 12px; border: 3px solid var(--ink); background: #fff; }
  #setup textarea { width: 100%; height: 180px; font: 14px/1.4 ui-monospace, monospace; border: 3px solid var(--ink); border-radius: 14px; padding: 10px; }
  #setup .hint { color: var(--ink2); font-size: 16px; margin: 0; }
  .critters { display: flex; gap: 6px; }

  /* 대기 화면 */
  #lobby { flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px; }
  #lobby .top { display: flex; gap: 32px; align-items: center; }
  #lobby .codebox { padding: 24px 40px; text-align: center; }
  #lobby .codebox .label { font-size: 24px; color: var(--ink2); }
  #lobby .codebox .code { font-family: var(--round); font-size: 120px; letter-spacing: 18px; line-height: 1; }
  #lobby .codebox .url { font-size: 17px; color: var(--ink2); word-break: break-all; max-width: 520px; }
  #qr { padding: 14px; background: #fff; border: 3px solid var(--ink); border-radius: 18px; }
  #qr img, #qr canvas { display: block; }
  #lobbyTeams { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; width: min(1300px, 100%); }
  #lobbyTeams .t { padding: 14px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 22px; }
  #lobbyTeams .dots { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; min-height: 18px; }
  #lobbyTeams .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--ink); }
  .demo-banner { background: #FFF3B0; border: 3px dashed var(--ink); border-radius: 16px; padding: 10px 18px; font-size: 18px; display: flex; gap: 14px; align-items: center; }

  /* 게임 화면 */
  #game { flex-direction: column; }
  .topbar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; }
  .topbar .logo { font-family: var(--round); font-size: 28px; }
  .pill { font-family: var(--round); font-size: 22px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 6px 18px; }
  .pill.phase { background: #FFD84D; }
  .timer { display: flex; align-items: center; gap: 4px; font-family: var(--round); font-size: 40px; min-width: 110px; justify-content: center; background: #fff; border: 3px solid var(--ink); border-radius: 18px; padding: 0 14px; }
  .timer.hurry { background: #FFB3C1; animation: shake .3s infinite; }
  .ctrl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 380px; grid-template-rows: minmax(0, 1fr); gap: 16px; padding: 0 20px 18px; min-height: 0; }
  .mapwrap { position: relative; min-height: 0; }
  .mapwrap svg.map { position: absolute; inset: 0; width: 100%; height: 100%; }
  .side { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow: auto; }
  .board { display: flex; flex-direction: column; gap: 10px; }
  .board .row { display: grid; grid-template-columns: 58px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-left-width: 10px; }
  .board .row .nm { font-family: var(--round); font-size: 22px; line-height: 1.1; }
  .board .row .sub { font-size: 15px; color: var(--ink2); }
  .board .row .score { font-family: var(--round); font-size: 30px; text-align: right; line-height: 1; }
  .board .row .score small { display: block; font-size: 14px; color: var(--ink2); }
  .board .status { font-size: 15px; font-weight: 700; }
  .crown { display: inline-block; width: 26px; height: 26px; vertical-align: -4px; object-fit: contain; }

  /* 겹치는 패널 */
  #overlay { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #overlay > * { pointer-events: auto; }
  .qcard { width: min(1000px, 96%); padding: 30px 38px; display: grid; gap: 22px; }
  .qmeta { display: flex; gap: 10px; font-size: 18px; color: var(--ink2); }
  .qmeta span { background: var(--sand); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 12px; }
  .qtext { font-size: 44px; font-weight: 800; line-height: 1.3; word-break: keep-all; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .choice { font-size: 28px; font-weight: 700; padding: 16px 20px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; display: flex; gap: 14px; align-items: center; word-break: keep-all; }
  .choice .n { font-family: var(--round); width: 40px; height: 40px; border-radius: 50%; background: var(--sand); border: 3px solid var(--ink); display: grid; place-items: center; flex: none; }
  .choice.right { background: #C8F3DF; }
  .choice.dim { opacity: .4; }
  .ox { display: flex; gap: 24px; justify-content: center; }
  .ox .choice { font-family: var(--round); font-size: 80px; width: 180px; justify-content: center; }
  .answer { font-size: 34px; font-weight: 800; }
  .answer b { background: #C8F3DF; border: 3px solid var(--ink); border-radius: 14px; padding: 2px 14px; }
  .explain { font-size: 24px; line-height: 1.5; background: var(--sand); border-radius: 16px; padding: 12px 18px; word-break: keep-all; }
  .teamres { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .teamres .tr { border: 3px solid var(--ink); border-radius: 16px; padding: 8px; text-align: center; display: grid; justify-items: center; gap: 2px; }
  .teamres .tr .r { font-family: var(--round); font-size: 22px; }
  .teamres .tr .c { font-family: var(--round); font-size: 26px; }
  .coop { font-family: var(--round); font-size: 26px; text-align: center; background: #FFD84D; border: 3px solid var(--ink); border-radius: 16px; padding: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 17px; }
  .chips .btn { font-family: var(--body); font-weight: 700; }

  .bubble { padding: 18px; display: grid; gap: 12px; text-align: center; }
  .bubble .title { font-family: var(--round); font-size: 32px; line-height: 1.2; }
  .bubble .count { font-size: 18px; color: var(--ink2); }
  .bags { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .bags.one { grid-template-columns: 1fr; }
  .bag { display: grid; justify-items: center; gap: 2px; font-family: var(--round); font-size: 20px; padding: 8px; border-radius: 16px; border: 3px solid transparent; }
  .bag .sack { width: 84px; height: 84px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; }
  .bag .sack img { width: 78%; height: 78%; object-fit: contain; }
  .bag .amt { font-size: 40px; min-height: 46px; line-height: 1.1; }
  .bag.win { border-color: var(--ok); background: #E4F8EF; }
  .bag.win .amt { color: var(--ok); }
  .bubble .result { font-family: var(--round); font-size: 30px; line-height: 1.25; }
  .bubble .result small { display: block; font-size: 17px; color: var(--ink2); }
  .summary { padding: 16px; display: grid; gap: 10px; }
  .summary .msg { font-family: var(--round); font-size: 26px; text-align: center; line-height: 1.3; }
  .summary .ch { display: flex; gap: 8px; align-items: center; font-size: 18px; font-weight: 700; line-height: 1.3; }
  .summary .ch .from { color: var(--no); font-weight: 600; }
  .bid-hint { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); font-family: var(--round); font-size: 28px; padding: 8px 24px; white-space: nowrap; }

  /* 결과 */
  #final { flex-direction: column; align-items: center; padding: 20px; gap: 16px; overflow: auto; }
  #final h1 { font-size: 56px; margin: 0; }
  #finalWrap { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 20px; width: min(1500px, 100%); }
  .rank { display: grid; grid-template-columns: 50px 70px 1fr auto; gap: 12px; align-items: center; padding: 10px 16px; margin-bottom: 10px; }
  .rank .place { font-family: var(--round); font-size: 40px; text-align: center; }
  .rank .nm { font-family: var(--round); font-size: 28px; }
  .rank .detail { font-size: 16px; color: var(--ink2); }
  .rank .tot { font-family: var(--round); font-size: 48px; }
  .low { padding: 20px; }
  .low h2 { margin: 0 0 10px; }
  .low ol { margin: 0; padding-left: 26px; font-size: 19px; line-height: 1.45; }
  .low li { margin-bottom: 10px; }
  .low .rate { font-family: var(--round); color: var(--no); }
</style>
</head>
<body class="host">

<section class="screen" id="setup">
  <div class="card">
    <h1><span class="critters" id="setupCritters"></span>역사 섬 땅따먹기</h1>
    <div id="resumeBox" class="demo-banner hidden">진행 중이던 게임이 있어요. <button class="btn small go" id="btnResume">이어서 하기</button><button class="btn small" id="btnDiscard">버리기</button></div>
    <div class="row">
      <label>모둠 수 <select id="teamCount"><option>4</option><option>5</option><option selected>6</option></select></label>
      <label>문제 수 <select id="rounds"><option>5</option><option>10</option><option>12</option><option>14</option><option selected>15</option><option>16</option><option>18</option></select></label>
      <label><input type="checkbox" id="bots"> 가상 학생 채우기 (혼자 시험해 볼 때)</label>
    </div>
    <div>
      <p class="hint">문제은행: 스프레드시트에서 제목 줄까지 전부 복사해서 붙여넣으세요. <b id="bankInfo"></b></p>
      <textarea id="bank" spellcheck="false" placeholder="번호	단원	난이도	유형	문제	보기	정답	허용 답안	해설	사용 게임"></textarea>
    </div>
    <div class="row"><button class="btn primary" id="btnCreate">방 만들기</button><a class="btn" href="rules.html" target="_blank" style="text-decoration:none">게임 설명 미리 보기</a><a class="btn" href="test.html" target="_blank" style="text-decoration:none">테스트 창</a><span class="hint" id="modeInfo"></span></div>
  </div>
</section>

<section class="screen hidden" id="lobby">
  <div class="top">
    <div class="card codebox">
      <div class="label">방 코드</div>
      <div class="code" id="roomCode">0000</div>
      <div class="url" id="joinUrl"></div>
    </div>
    <div id="qr"></div>
  </div>
  <div id="demoBox" class="demo-banner hidden">데모 모드: 이 컴퓨터의 다른 창에서만 들어올 수 있어요. <button class="btn small" id="btnOpenStudent">학생 창 열기</button></div>
  <div id="lobbyTeams"></div>
  <div style="display:flex;gap:14px"><button class="btn" id="btnRules" style="font-size:26px">게임 설명 보기</button><button class="btn go" id="btnStart" style="font-size:30px">시작!</button></div>
</section>

<div id="rulesLayer" class="hidden" style="position:fixed;inset:0;z-index:50;background:#000">
  <iframe id="rulesFrame" title="게임 설명" style="width:100%;height:100%;border:0"></iframe>
</div>

<section class="screen hidden" id="game">
  <header class="topbar">
    <div class="logo">역사 섬 땅따먹기</div>
    <div class="pill" id="roundInfo"></div>
    <div class="pill phase" id="phaseInfo"></div>
    <div class="timer" id="timer"></div>
    <div class="ctrl">
      <button class="btn small primary" id="btnNext">다음</button>
      <button class="btn small" id="btnPause">일시정지</button>
      <button class="btn small" id="btnSkip">문제 넘기기</button>
      <button class="btn small" id="btnLast">마지막 라운드로</button>
      <button class="btn small" id="btnSound" aria-label="소리 켜기/끄기">소리 켬</button>
      <button class="btn small" id="btnEnd">그만하기</button>
    </div>
  </header>
  <main class="stage">
    <div class="mapwrap"><svg class="map" id="map" role="img" aria-label="육각형 땅 지도"></svg><div id="overlay"></div></div>
    <aside class="side"><div id="sidecard"></div><div class="board" id="board"></div></aside>
  </main>
</section>

<section class="screen hidden" id="final">
  <h1 style="display:flex;align-items:center;gap:14px"><img class="ico" src="images/chest.png" alt="" style="width:72px;height:72px">최종 결과<img class="ico" src="images/chest.png" alt="" style="width:72px;height:72px"></h1>
  <div id="finalWrap">
    <div id="ranks"></div>
    <div class="card low"><h2>많이 틀린 문제 TOP 5</h2><ol id="lowList"></ol></div>
  </div>
  <div class="row" style="display:flex;gap:12px"><button class="btn" id="btnCopyLow">틀린 문제 복사</button><button class="btn" id="btnDelete">방 삭제하고 처음으로</button></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/backend.js"></script>
<script src="js/hexmap.js"></script>
<script src="js/grade.js"></script>
<script src="js/rules.js"></script>
<script src="js/common.js"></script>
<script src="js/host.js"></script>
</body>
</html>
