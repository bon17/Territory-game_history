<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CDEBFB">
<title>역사 섬 땅따먹기</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body.play { min-height: 100%; display: flex; flex-direction: column; }
  .wrap { width: min(1100px, 100%); margin: 0 auto; padding: 14px 18px 24px; flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
  .bar .who { font-family: var(--round); font-size: 22px; line-height: 1.1; }
  .bar .who small { display: block; font-family: var(--body); font-size: 14px; color: var(--ink2); }
  .bar .right { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .chip { font-family: var(--round); font-size: 20px; background: #fff; border: 3px solid var(--ink); border-radius: 999px; padding: 4px 14px; white-space: nowrap; }
  .chip.timer { font-size: 26px; min-width: 64px; text-align: center; }
  .chip.timer.hurry { background: #FFB3C1; }
  main { flex: 1; display: flex; flex-direction: column; gap: 14px; }
  .panel { padding: 22px; display: grid; gap: 18px; }
  main > .panel:only-child { flex: 1; align-content: center; }
  .big { font-family: var(--round); font-size: 34px; text-align: center; line-height: 1.3; }
  .mid { font-size: 20px; text-align: center; color: var(--ink2); line-height: 1.5; word-break: keep-all; }
  .center { display: grid; justify-items: center; gap: 14px; text-align: center; }

  /* 접속 */
  .codeinput { font-family: var(--round); font-size: 56px; letter-spacing: 12px; text-align: center; width: 280px; padding: 8px; border: 3px solid var(--ink); border-radius: 18px; }
  .pickgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .pickteam { display: grid; justify-items: center; gap: 6px; padding: 12px; font-size: 22px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--ink); min-height: 44px; }
  .pickteam[aria-pressed="true"] { outline: 5px solid #FF7A00; outline-offset: 2px; }
  .nums { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
  .nums button { font-size: 30px; height: 70px; border-radius: 18px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); }
  .nums button[aria-pressed="true"] { background: #FFD84D; }
  .nums button.taken { opacity: .35; }
  .err { color: var(--no); font-weight: 700; text-align: center; min-height: 1.4em; }

  /* 문제 */
  .qtext { font-size: 30px; font-weight: 800; line-height: 1.4; word-break: keep-all; }
  .qmeta { display: flex; gap: 8px; font-size: 15px; color: var(--ink2); flex-wrap: wrap; }
  .qmeta span { background: var(--sand); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 10px; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .opt { font-family: var(--body); font-size: 22px; font-weight: 700; text-align: left; padding: 16px 18px; border: 3px solid var(--ink); border-radius: 18px; background: #fff; box-shadow: 0 4px 0 var(--ink); min-height: 96px; display: flex; gap: 12px; align-items: center; word-break: keep-all; }
  .opt .n { font-family: var(--round); width: 36px; height: 36px; border-radius: 50%; background: var(--sand); border: 3px solid var(--ink); display: grid; place-items: center; flex: none; }
  .opt[aria-pressed="true"] { background: #FFD84D; transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
  .oxrow { display: flex; gap: 20px; justify-content: center; }
  .oxrow .opt { font-family: var(--round); font-size: 90px; width: min(240px, 40vw); height: 190px; justify-content: center; }
  .answerbox { font-size: 30px; padding: 14px 18px; border: 3px solid var(--ink); border-radius: 18px; width: 100%; font-family: var(--body); }
  .submit { font-size: 28px; width: 100%; }

  /* 결과 */
  .mark { font-family: var(--round); font-size: 120px; line-height: 1; width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center; border: 4px solid var(--ink); color: #fff; }
  .mark.ok { background: var(--ok); }
  .mark.no { background: var(--no); }

  /* 걸기 */
  .bidlayout { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(280px, 1fr); gap: 14px; flex: 1; min-height: 0; }
  @media (orientation: portrait), (max-width: 760px) { .bidlayout { grid-template-columns: 1fr; } }
  .mapbox { padding: 10px; min-height: 340px; display: grid; place-items: center; }
  .mapbox svg { max-height: 64vh; }
  .side { padding: 18px; display: grid; gap: 14px; align-content: start; }
  .stepper { display: flex; align-items: center; justify-content: center; gap: 16px; }
  .stepper button { width: 70px; height: 70px; border-radius: 50%; font-size: 40px; border: 3px solid var(--ink); background: #fff; box-shadow: 0 4px 0 var(--ink); }
  .stepper .val { font-family: var(--round); font-size: 60px; min-width: 90px; text-align: center; }
  .selname { font-family: var(--round); font-size: 28px; text-align: center; min-height: 1.3em; }

  .chars-mini { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .envelope { padding: 18px; text-align: center; display: grid; gap: 8px; background: #FFF0F3; }
  .envelope .m { font-family: var(--round); font-size: 24px; }
</style>
</head>
<body class="play">
<div class="wrap">
  <header class="card bar hidden" id="bar">
    <span id="barAv"></span>
    <div class="who" id="barWho"></div>
    <div class="right"><span class="chip" id="barCoins"></span><span class="chip timer hidden" id="ptimer"></span></div>
  </header>
  <main id="main"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/compat/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="js/backend.js"></script>
<script src="js/hexmap.js"></script>
<script src="js/grade.js"></script>
<script src="js/rules.js"></script>
<script src="js/common.js"></script>
<script src="js/play.js"></script>
</body>
</html>
